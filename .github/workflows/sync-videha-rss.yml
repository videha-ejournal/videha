name: Sync Videha RSS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'videha-rss.xml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: sync-videha-rss
  cancel-in-progress: true

jobs:
  sync-rss:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download current RSS from Videha server
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="https://www.videha.co.in/videha-rss.xml?github_sync=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TMP="videha-rss.xml.new"

          curl -4 --http1.1 \
            --fail --location --silent --show-error \
            --connect-timeout 10 --max-time 45 \
            --retry 2 --retry-delay 3 --retry-all-errors \
            --user-agent "Mozilla/5.0 (compatible; Videha-RSS-Sync/1.0; +https://videha-ejournal.github.io/videha/)" \
            --header "Cache-Control: no-cache" \
            --header "Pragma: no-cache" \
            "$SOURCE" \
            --output "$TMP"

          test -s "$TMP"
          grep -qi '<rss' "$TMP"
          grep -qi '<channel' "$TMP"
          grep -qi '<item' "$TMP"

          mv "$TMP" videha-rss.xml
          echo "Downloaded RSS successfully."
          grep -m1 -o '<title>[^<]*</title>' videha-rss.xml || true

      - name: Commit RSS only when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Videha RSS Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videha-rss.xml

          if git diff --cached --quiet; then
            echo "RSS unchanged; nothing to commit."
          else
            git commit -m "Sync Videha RSS feed"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
