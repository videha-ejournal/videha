name: Build Videha Universal Search

on:
  push:
    branches: [main]
    paths-ignore:
      - 'pagefind/**'
      - 'data/videha-archive-manifest.json'
      - 'data/videha-deployment.json'
      - 'data/videha-knowledge-graph.json'
      - 'data/videha-author-publications.json'
      - 'data/videha-archive-facets.json'
      - 'research/**'
      - 'tei/**'
      - 'iiif/**'
      - 'CITATION.cff'
      - '.zenodo.json'
      - 'codemeta.json'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'current-issue.json'
      - 'research-registry.json'
      - 'research-registry.jsonld'
      - 'research-registry.bib'
      - 'research-registry.ris'
      - 'research-registry.csl.json'
      - 'research-registry.ttl'
      - 'doi-metadata.json'
      - 'SCHOLARLY-PROVENANCE.md'
      - 'PRESERVATION-POLICY.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: videha-pagefind-main
  cancel-in-progress: true

jobs:
  build-search:
    if: >-
      github.event_name != 'push' ||
      (!contains(github.event.head_commit.message, '[research-bot]') &&
       !contains(github.event.head_commit.message, '[scholarly-bot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Refresh article-level author and title inventory
        run: python3 scholar-tools/build_article_inventory.py

      - name: Refresh Videha digital archive manifests
        run: python3 tools/build-videha-digital.py

      - name: Refresh historical author/title/genre facets
        run: python3 tools/build-videha-archive-facets.py . data/videha-archive-facets.json

      - name: Validate generated document-search corpus
        run: python3 tools/test-document-search.py

      - name: Validate publication-certificate widget
        run: python3 tools/test-publication-certificate.py

      - name: Prepare searchable HTML/HTM corpus
        run: python3 tools/videha-pagefind-prepare.py . _pagefind_build

      - name: Build Pagefind index
        run: npx -y pagefind@1.5.2 --site _pagefind_build --output-subdir pagefind --glob '**/*.{html,htm}'

      - name: Smoke-test Pagefind counts, naming, existing HTML, and OCR
        run: node tools/test-pagefind-search.mjs

      - name: Install generated search bundle
        run: |
          rm -rf pagefind
          cp -R _pagefind_build/pagefind ./pagefind
          rm -rf _pagefind_build

      - name: Commit refreshed search index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pagefind data/videha-archive-manifest.json data/videha-knowledge-graph.json data/videha-author-publications.json data/videha-deployment.json data/videha-archive-facets.json research/data/article-inventory.json
          if git diff --cached --quiet; then
            echo "Search index unchanged."
          else
            git commit -m "Build Videha universal search index [scholarly-bot]"
            git pull --rebase origin main
            git push
          fi
