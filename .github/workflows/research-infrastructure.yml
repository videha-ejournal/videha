name: Build Videha Research Infrastructure

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/research-infrastructure.yml'
      - 'scholar-tools/build_research_infrastructure.py'
      - 'scholar-tools/validate_research_infrastructure.py'
      - 'scholar-tools/normalize_research_sitemap.py'
      - 'scholar-tools/update_current_issue_manifest.py'
      - 'research-registry.*'
      - 'current-issue.json'
      - 'doi-metadata.json'
      - 'SCHOLARLY-PROVENANCE.md'
      - 'PRESERVATION-POLICY.md'
      - 'research/**'
      - '**/*.htm'
      - '**/*.html'
      - 'videha-rss.xml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-infrastructure.yml'
      - 'scholar-tools/build_research_infrastructure.py'
      - 'scholar-tools/validate_research_infrastructure.py'
      - 'scholar-tools/normalize_research_sitemap.py'
      - 'scholar-tools/update_current_issue_manifest.py'
      - 'research-registry.*'
      - 'current-issue.json'
      - 'doi-metadata.json'
      - 'SCHOLARLY-PROVENANCE.md'
      - 'PRESERVATION-POLICY.md'
      - 'research/**'
      - '**/*.htm'
      - '**/*.html'
      - 'videha-rss.xml'
  schedule:
    - cron: '41 2 * * 1'

permissions:
  contents: write

concurrency:
  group: videha-research-infrastructure
  cancel-in-progress: true

jobs:
  build-validate:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[research-bot]')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Confirm Python runtime
        run: python3 --version
      - name: Build canonical metadata, sitemaps, TEI, IIIF, citation authority and fixity
        run: python3 scholar-tools/build_research_infrastructure.py
      - name: Generate source-controlled current issue manifest
        run: python3 scholar-tools/update_current_issue_manifest.py
      - name: Normalize sitemap to real HTML pages
        run: python3 scholar-tools/normalize_research_sitemap.py
      - name: Validate scholarly preservation layer
        run: python3 scholar-tools/validate_research_infrastructure.py
      - name: Validate research registry and provenance package
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          required=['research/index.html','research-registry.json','research-registry.jsonld','research-registry.bib','research-registry.ris','current-issue.json','doi-metadata.json','SCHOLARLY-PROVENANCE.md','PRESERVATION-POLICY.md']
          missing=[p for p in required if not (root/p).exists()]
          if missing: raise SystemExit(f'Missing research registry files: {missing}')
          reg=json.loads((root/'research-registry.json').read_text(encoding='utf-8'))
          if reg.get('issn')!='2229-547X': raise SystemExit('Registry ISSN mismatch')
          if len(reg.get('resources',[]))<5: raise SystemExit('Research registry unexpectedly small')
          isbns=[r['isbn'] for r in reg.get('isbnAuthority',[])]
          if len(isbns)!=len(set(isbns)) or len(isbns)<12: raise SystemExit('ISBN authority duplicate/incomplete')
          issue=json.loads((root/'current-issue.json').read_text(encoding='utf-8'))
          if issue.get('issueNumber') is None or not issue.get('issueDate'): raise SystemExit('Current issue manifest incomplete')
          doi=json.loads((root/'doi-metadata.json').read_text(encoding='utf-8'))
          if doi.get('doi') is not None or doi.get('registrationStatus')!='not-minted': raise SystemExit('DOI metadata must not fabricate an identifier')
          print({'registryResources':len(reg['resources']),'isbnRecords':len(isbns),'currentIssue':issue['issueNumber'],'doiStatus':doi['registrationStatus']})
          PY
      - name: Upload research infrastructure audit artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: videha-research-infrastructure
          path: |
            research/
            tei/
            iiif/
            sitemap.xml
            robots.txt
            CITATION.cff
            .zenodo.json
            codemeta.json
            research-registry.json
            research-registry.jsonld
            research-registry.bib
            research-registry.ris
            current-issue.json
            doi-metadata.json
            SCHOLARLY-PROVENANCE.md
            PRESERVATION-POLICY.md
          retention-days: 30
      - name: Commit generated infrastructure on main
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "videha-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Update Videha scholarly research infrastructure [research-bot]"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              echo "Push attempt $attempt failed; retrying"
              sleep 2
            done
            exit 1
          fi
