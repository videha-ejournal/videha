name: Build Videha Research Infrastructure

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/research-infrastructure.yml'
      - 'scholar-tools/build_research_infrastructure.py'
      - 'scholar-tools/validate_research_infrastructure.py'
      - 'scholar-tools/normalize_research_sitemap.py'
      - '**/*.htm'
      - '**/*.html'
      - 'videha-rss.xml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-infrastructure.yml'
      - 'scholar-tools/build_research_infrastructure.py'
      - 'scholar-tools/validate_research_infrastructure.py'
      - 'scholar-tools/normalize_research_sitemap.py'
      - '**/*.htm'
      - '**/*.html'
      - 'videha-rss.xml'
  schedule:
    - cron: '41 2 * * 1'

permissions:
  contents: write

concurrency:
  group: videha-research-infrastructure
  cancel-in-progress: true

jobs:
  build-validate:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[research-bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build canonical metadata, sitemaps, TEI, IIIF, citation authority and fixity
        run: python scholar-tools/build_research_infrastructure.py
      - name: Normalize sitemap to real HTML pages
        run: python scholar-tools/normalize_research_sitemap.py
      - name: Validate scholarly preservation layer
        run: python scholar-tools/validate_research_infrastructure.py
      - name: Upload research infrastructure audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: videha-research-infrastructure
          path: |
            research/
            tei/
            iiif/
            sitemap.xml
            robots.txt
            CITATION.cff
            .zenodo.json
            codemeta.json
      - name: Commit generated infrastructure on main
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "videha-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Update Videha scholarly research infrastructure [research-bot]"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              echo "Push attempt $attempt failed; retrying"
              sleep 2
            done
            exit 1
          fi
