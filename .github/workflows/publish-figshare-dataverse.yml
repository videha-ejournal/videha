name: Publish Videha to Figshare and Dataverse

on:
  workflow_dispatch:
    inputs:
      provider:
        description: External repository service
        required: true
        default: both
        type: choice
        options:
          - both
          - figshare
          - dataverse
      mode:
        description: Create/update drafts first; choose publish only after reviewing metadata
        required: true
        default: draft
        type: choice
        options:
          - draft
          - publish

permissions:
  contents: write

concurrency:
  group: external-preservation-publish
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate publisher
        run: python -m py_compile scholar-tools/publish_external_archives.py

      - name: Create or publish external preservation records
        id: publish
        continue-on-error: true
        env:
          FIGSHARE_TOKEN: ${{ secrets.FIGSHARE_TOKEN }}
          FIGSHARE_CATEGORY_IDS: ${{ vars.FIGSHARE_CATEGORY_IDS }}
          DATAVERSE_API_TOKEN: ${{ secrets.DATAVERSE_API_TOKEN }}
          DATAVERSE_SERVER: ${{ vars.DATAVERSE_SERVER }}
          DATAVERSE_COLLECTION: ${{ vars.DATAVERSE_COLLECTION }}
          DATAVERSE_CONTACT_EMAIL: ${{ vars.DATAVERSE_CONTACT_EMAIL }}
          DATAVERSE_LICENSE_NAME: ${{ vars.DATAVERSE_LICENSE_NAME }}
          DATAVERSE_LICENSE_URI: ${{ vars.DATAVERSE_LICENSE_URI }}
        run: |
          set -u
          ARGS=(--provider "${{ inputs.provider }}" --results "$RUNNER_TEMP/external-preservation-results.json")
          if [ "${{ inputs.mode }}" = "publish" ]; then
            ARGS+=(--publish)
          fi
          python scholar-tools/publish_external_archives.py "${ARGS[@]}"

      - name: Preserve returned provider IDs and PIDs
        if: always()
        run: |
          git config user.name "videha-preservation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scholar-tools/external-preservation-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Figshare and Dataverse preservation identifiers [preservation-bot]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No provider identifiers changed."
          fi

      - name: Upload preservation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-preservation-report-${{ github.run_id }}
          path: ${{ runner.temp }}/external-preservation-results.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail if provider operation failed
        if: steps.publish.outcome == 'failure'
        run: |
          echo "One or more external preservation operations failed. Review the uploaded report."
          exit 1
