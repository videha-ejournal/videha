name: Verify Videha Main ↔ Mirror Parity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-videha-parity.yml'
      - 'index.htm'
      - 'current-issue.json'
  # Recurring host monitoring is owned by mithila-vajji-anga's videha-parity.yml.
  # Keep this repository's issue check on relevant changes; live checks are manual.

permissions:
  contents: read

concurrency:
  group: videha-main-mirror-parity
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out mirror source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify issue consistency (live hosts on manual runs only)
        env:
          CHECK_LIVE: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re,time,urllib.request
          from pathlib import Path

          DIGITS=str.maketrans('०१२३४५६७८९','0123456789')
          MONTHS={'जनवरी':'01','फरवरी':'02','मार्च':'03','अप्रैल':'04','मई':'05','जून':'06','जुलाई':'07','अगस्त':'08','सितम्बर':'09','सितंबर':'09','अक्टूबर':'10','नवम्बर':'11','नवंबर':'11','दिसम्बर':'12','दिसंबर':'12'}
          def strip_tags(s):
              return re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',s)).strip()
          def issue(s):
              p=strip_tags(s)
              m=re.search(r'विदेह\s+अंक\s+([०-९0-9]+)\s*\[\s*([०-९0-9]{1,2})\s+([^\s\]]+)\s+([०-९0-9]{4})\s*\]',p)
              if not m: raise RuntimeError('Current issue marker not found')
              n=int(m.group(1).translate(DIGITS)); d=m.group(2).translate(DIGITS).zfill(2); y=m.group(4).translate(DIGITS); mo=MONTHS.get(m.group(3))
              if not mo: raise RuntimeError(f'Unknown month: {m.group(3)}')
              return {'issueNumber':n,'issueDate':f'{y}-{mo}-{d}'}
          def fetch(url):
              last=None
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Videha-Parity-Monitor/1.0'})
                      return urllib.request.urlopen(req,timeout=25).read().decode('utf-8','ignore')
                  except Exception as e:
                      last=e
                      if attempt < 3: time.sleep(4*(attempt+1))
              raise RuntimeError(f'Unable to fetch {url}: {last}')

          report={'parity':None,'status':'checking','sources':{},'errors':[]}
          def record(name, loader):
              try:
                  value=loader()
                  report['sources'][name]={'state':'checked','issue':value}
                  return value
              except Exception as e:
                  report['sources'][name]={'state':'invalid-source','error':str(e)}
                  report['errors'].append(f'{name}: {e}')

          local=record('mirrorSource',lambda: issue(Path('index.htm').read_text(encoding='utf-8')))
          def read_manifest():
              manifest=json.loads(Path('current-issue.json').read_text(encoding='utf-8'))
              return {'issueNumber':int(manifest['issueNumber']),'issueDate':manifest['issueDate']}
          declared=record('manifest',read_manifest)
          if local is not None and declared is not None and local!=declared:
              report['errors'].append(f'Mirror source/manifest drift: index={local} manifest={declared}')

          check_live=os.environ.get('CHECK_LIVE')=='true'
          if check_live:
              for name,url in [('mainLive','https://www.videha.co.in/'),('mirrorLive','https://videha-ejournal.github.io/videha/')]:
                  try:
                      html=fetch(url)
                  except RuntimeError as e:
                      report['sources'][name]={'state':'unavailable-source','url':url,'error':str(e)}
                      continue
                  value=record(name,lambda: issue(html))
                  report['sources'][name]['url']=url
                  if value is not None and declared is not None and value!=declared:
                      report['errors'].append(f'{name} issue drift: live={value} manifest={declared}')
          else:
              report['sources'].update({name:{'state':'not-requested'} for name in ['mainLive','mirrorLive']})

          unavailable=any(source['state']=='unavailable-source' for source in report['sources'].values())
          if report['errors']:
              report['status']='failed'
              report['parity']=False
          elif unavailable:
              report['status']='incomplete-source-unavailable'
          elif check_live:
              report['status']='verified'
              report['parity']=True
          else:
              report['status']='local-consistency-verified'
          payload=json.dumps(report,ensure_ascii=False,indent=2)
          Path('reports').mkdir(exist_ok=True)
          Path('reports/videha-issue-parity.json').write_text(payload+'\n',encoding='utf-8')
          print(payload)
          summary=os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary,'a',encoding='utf-8') as f:
                  f.write('## Videha issue check: '+report['status']+'\n\n```json\n'+payload+'\n```\n')
          if unavailable:
              print('::warning::Live parity is incomplete: a source host is unavailable. See the evidence report; parity is not verified.')
          if report['errors']:
              raise SystemExit('VIDEHA ISSUE CHECK FAILED: '+'; '.join(report['errors']))
          PY
      - name: Preserve issue check evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: videha-issue-parity
          path: reports/videha-issue-parity.json
          if-no-files-found: error
          retention-days: 30
