name: Update Videha Scholar Research Book

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/data/articles.json'
      - 'scholar-tools/build_research_book.py'
      - '.github/workflows/build-research-book.yml'

permissions:
  contents: write

concurrency:
  group: videha-scholar-research-book
  cancel-in-progress: true

jobs:
  update-book:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out canonical inventory, historic Book, and updater
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: |
            research
            scholar-tools
          sparse-checkout-cone-mode: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Synchronize only Research Book data sections from canonical inventory
        run: python3 scholar-tools/build_research_book.py

      - name: Verify same-source alignment and historic Book shell
        run: python3 scholar-tools/build_research_book.py --check

      - name: Independent historic-shell and two-annex guard
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          payload=json.loads(Path('research/data/articles.json').read_text(encoding='utf-8'))
          articles=payload['articles']
          text=Path('research/videha-scholar-research-book.html').read_text(encoding='utf-8')
          expected=len(articles)
          if int(payload.get('count', expected)) != expected:
              raise SystemExit('canonical inventory count mismatch')

          markers=[
              'विदेह शोध-लेख : अंक १ सँ',
              'VIDEHA Home · www.videha.co.in',
              'GitHub Home · videha-ejournal.github.io/videha',
              'id="videha-tts-toggle"',
              'id="book-search"',
              'class="back-top"',
              'videha-tts.js',
              'videha-translate.js',
              'videha-access.js',
              'aria-label="पृष्ठ सुनबाक, अनुवाद आ सहायक तकनीक नियंत्रण"',
              'अनुलग्नक १ : लेखकानुक्रमेण सम्पूर्ण सूची',
              'अनुलग्नक २ : विधावार सम्पूर्ण सूची',
          ]
          missing=[x for x in markers if x not in text]
          if missing:
              raise SystemExit(f'historic Research Book shell damaged: {missing}')

          h1=re.search(r'(?is)<h2[^>]*>\s*अनुलग्नक\s*१.*?</h2>', text)
          h2=re.search(r'(?is)<h2[^>]*>\s*अनुलग्नक\s*२.*?</h2>', text)
          if not h1 or not h2 or h1.start() >= h2.start():
              raise SystemExit('Research Book annex boundaries missing')
          author_section=text[h1.end():h2.start()]
          author_tbody=re.search(r'(?is)<tbody\b[^>]*>(.*?)</tbody>', author_section)
          if not author_tbody:
              raise SystemExit('author-order table missing')
          author_rows=len(re.findall(r'(?is)<tr\b[^>]*>.*?</tr>', author_tbody.group(1)))
          if author_rows != expected:
              raise SystemExit(f'author annex rows {author_rows} != inventory {expected}')

          annex2=text[h2.end():]
          genre_rows=sum(
              len(re.findall(r'(?is)<tr\b[^>]*>.*?</tr>', body))
              for body in re.findall(r'(?is)<tbody\b[^>]*>(.*?)</tbody>', annex2)
          )
          if genre_rows != expected:
              raise SystemExit(f'genre annex rows {genre_rows} != inventory {expected}')

          for marker in (
              '<meta name="videha-article-source" content="research/data/articles.json">',
              f'<meta name="videha-article-count" content="{expected}">',
          ):
              if marker not in text:
                  raise SystemExit(f'provenance missing: {marker}')

          print({'canonicalInventory':expected,'authorAnnexRows':author_rows,'genreAnnexRows':genre_rows,'historicShell':'preserved'})
          PY

      - name: Commit data-only Research Book update
        run: |
          git config user.name "videha-scholar-bot"
          git config user.email "videha-scholar-bot@users.noreply.github.com"
          git add research/videha-scholar-research-book.html
          if git diff --cached --quiet; then
            echo "Research Book already matches canonical article inventory; historic shell unchanged"
          else
            count="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('research/data/articles.json').read_text(encoding='utf-8'))
          print(len(data['articles']))
          PY
          )"
            git commit -m "Synchronize historic Research Book to ${count} papers [skip actions]"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              sleep 2
            done
            exit 1
          fi

# This comment intentionally triggers the protected data-only sync after restoring the historic Book shell.
