name: Inspect Historic Videha Scholar Research Book Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-research-book.yml'

permissions:
  contents: write

concurrency:
  group: videha-scholar-research-book-inspect
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out Book and canonical inventory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            research
          sparse-checkout-cone-mode: true

      - name: Identify inventory records absent from the restored Book
        run: |
          python3 - <<'PY'
          import html, json, re
          from pathlib import Path, PurePosixPath
          from urllib.parse import unquote, urlparse

          book_path=Path('research/videha-scholar-research-book.html')
          inv_path=Path('research/data/articles.json')
          book=book_path.read_text(encoding='utf-8')
          payload=json.loads(inv_path.read_text(encoding='utf-8'))
          articles=payload['articles']

          def canon(v):
              v=unquote(str(v or '')).replace('\\','/').strip()
              if not v: return ''
              p=urlparse(v)
              if p.scheme and p.netloc: v=unquote(p.path)
              v=v.split('#',1)[0].split('?',1)[0].lstrip('/')
              if v.startswith('videha/'): v=v[len('videha/'):]
              if v.startswith('research/'): return str(PurePosixPath(v))
              if v.endswith(('.htm','.html')): return str(PurePosixPath('research')/PurePosixPath(v))
              return ''

          inv=[]
          for a in articles:
              p=canon(a.get('path'))
              if not p: raise SystemExit('bad inventory path')
              inv.append((p,a))
          invset={p for p,_ in inv}
          hrefs=re.findall(r'(?is)\bhref\s*=\s*["\']([^"\']+)["\']',book)
          present={p for h in hrefs if (p:=canon(html.unescape(h))) in invset}
          missing=[dict(a, _canonical_path=p) for p,a in inv if p not in present]
          if len(present)!=839 or len(missing)!=3 or len(articles)!=842:
              raise SystemExit(f'unexpected counts: present={len(present)}, missing={len(missing)}, inventory={len(articles)}')

          # Capture the real structure after Annex 2 so the permanent synchronizer can
          # update the genre view without replacing the publication shell.
          m=re.search(r'(?is)<h2[^>]*>\s*अनुलग्नक\s*२.*?</h2>(.*?)(?=<script\b|</main>|</body>)',book)
          annex2=m.group(1) if m else ''
          headings=[]
          for hm in re.finditer(r'(?is)<h3\b[^>]*>(.*?)</h3>',annex2):
              label=' '.join(re.sub(r'(?is)<[^>]+>',' ',hm.group(1)).split())
              tail=annex2[hm.end():hm.end()+1800]
              headings.append({'heading':html.unescape(label),'following_html':tail[:1800]})
              if len(headings)>=4: break

          out={
              'inventory_count':len(articles),
              'book_present_unique_paths':len(present),
              'missing_count':len(missing),
              'missing_records':missing,
              'annex2_found':bool(m),
              'annex2_first_sections':headings,
          }
          Path('research/research-book-missing-diagnostic.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'inventory':len(articles),'present':len(present),'missing':len(missing)},ensure_ascii=False))
          PY

      - name: Commit diagnostic for inspection
        run: |
          git config user.name "videha-scholar-bot"
          git config user.email "videha-scholar-bot@users.noreply.github.com"
          git add research/research-book-missing-diagnostic.json
          git commit -m "Inspect three Research Book inventory additions [skip actions]"
          git pull --rebase origin main
          git push
