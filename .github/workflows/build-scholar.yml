# Videha Scholar workflow — expanded 2026-08-26 for audit-queue publication
name: Build Videha Scholar Research Index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-scholar.yml'
      - 'scholar-data/**'
      - 'scholar-tools/**'
      - 'templates/scholar-article.html'
      - 'search-documents/videha-*.html'
      - 'search-documents/videha-*.htm'

permissions:
  contents: write

concurrency:
  group: videha-scholar-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            search-documents
            scholar-tools
            scholar-data
            templates
            research
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose article boundaries
        run: python scholar-tools/diagnose_boundaries.py
      - name: Build complete article inventory
        run: python scholar-tools/build_article_inventory.py
      - name: Summarize Scholar candidate strength
        run: python scholar-tools/summarize_inventory.py
      - name: Build article-level scholarly catalogue
        run: python scholar-tools/build_section_catalogue.py
      - name: Harden Scholar candidate rankings
        run: python scholar-tools/harden_section_catalogue.py
      - name: Discover legacy top-level scholarly sections
        run: python scholar-tools/build_top_level_candidates.py
      - name: Build full research corpus including hardened audit queue
        run: python scholar-tools/build_all_research.py
      - name: Validate Scholar metadata
        run: python scholar-tools/validate_scholar.py
      - name: Commit generated research layer
        run: |
          git config user.name "videha-scholar-bot"
          git config user.email "videha-scholar-bot@users.noreply.github.com"
          git add research/
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Update Videha Scholar research index [skip actions]"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              echo "Push attempt $attempt failed; retrying after refresh"
              sleep 2
            done
            exit 1
          fi
