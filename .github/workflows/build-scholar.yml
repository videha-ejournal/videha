# Videha Scholar deep-index maintenance workflow.
# Authoritative research infrastructure is built by research-infrastructure.yml;
# this workflow is intentionally limited to scheduled/manual scholarly maintenance.
name: Build Videha Scholar Research Index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scholar-data/articles/**'
      - 'scholar-tools/build_research.py'
      - 'scholar-tools/build_all_research.py'
      - 'scholar-tools/audit_research_stubs.py'
      - '.github/workflows/build-scholar.yml'
  schedule:
    - cron: '23 3 * * 0'

permissions:
  contents: write

concurrency:
  group: videha-scholar-maintenance
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out scholarly source subset
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: |
            search-documents
            scholar-tools
            scholar-data
            templates
            research
            tools
          sparse-checkout-cone-mode: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Diagnose article boundaries
        run: python3 scholar-tools/diagnose_boundaries.py
      - name: Build complete article inventory
        run: python3 scholar-tools/build_article_inventory.py
      - name: Summarize Scholar candidate strength
        run: python3 scholar-tools/summarize_inventory.py
      - name: Build article-level scholarly catalogue
        run: python3 scholar-tools/build_section_catalogue.py
      - name: Harden Scholar candidate rankings
        run: python3 scholar-tools/harden_section_catalogue.py
      - name: Discover legacy top-level scholarly sections
        run: python3 scholar-tools/build_top_level_candidates.py
      - name: Deep-map 38 Sadeha HTML sources to original Videha articles
        run: python3 scholar-tools/build_sadeha_crossmap.py
      - name: Flag probable Sadeha-confirmed legacy author-title reversals
        run: python3 scholar-tools/build_sadeha_swapped_metadata.py
      - name: Build full research corpus including audit queues and Sadeha discoveries
        run: python3 scholar-tools/build_all_research.py
      - name: Generate Research Book from canonical article inventory
        run: python3 scholar-tools/build_research_book.py
      - name: Verify Research Book is byte-for-byte current with article inventory
        run: python3 scholar-tools/build_research_book.py --check
      - name: Reject template-canonical regression in generated research papers
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path('research/data/articles.json').read_text(encoding='utf-8'))
          articles=payload.get('articles',[])
          if not articles:
              raise SystemExit('Canonical article inventory is empty')
          bad=[]
          for article in articles:
              p=Path(article['path'])
              text=p.read_text(encoding='utf-8',errors='ignore')
              if 'templates/scholar-article.html' in text:
                  bad.append(str(p))
          if bad:
              raise SystemExit(f'Template canonical regression in {len(bad)} generated pages: {bad[:3]}')
          print(f'Canonical regression guard passed for {len(articles)} inventory papers.')
          PY
      - name: Validate Scholar metadata
        run: python3 scholar-tools/validate_scholar.py
      - name: Audit all canonical article pages for stubs or missing HTML
        run: python3 scholar-tools/audit_research_stubs.py --fail-on-stub
      - name: Commit generated research layer
        run: |
          git config user.name "videha-scholar-bot"
          git config user.email "videha-scholar-bot@users.noreply.github.com"
          git add research/
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Update Videha Scholar research index [skip actions]"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              echo "Push attempt $attempt failed; retrying after refresh"
              sleep 2
            done
            exit 1
          fi