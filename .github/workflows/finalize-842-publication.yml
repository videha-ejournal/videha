name: Finalize 842 Research Publication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-842-publication.yml'

permissions:
  contents: write

concurrency:
  group: videha-finalize-842-research
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out current research corpus with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: |
            research
          sparse-checkout-cone-mode: true
      - name: Identify the three new publications from the authoritative inventories
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          BASE='1af1cdad0a7c3b2338e14069f5ab0d633d803130'
          old=json.loads(subprocess.check_output(['git','show',f'{BASE}:research/data/articles.json'], text=True))
          cur=json.loads(Path('research/data/articles.json').read_text(encoding='utf-8'))
          old_articles=old['articles']; cur_articles=cur['articles']
          old_by_path={a['path']:a for a in old_articles}
          cur_by_path={a['path']:a for a in cur_articles}
          added=sorted(set(cur_by_path)-set(old_by_path))
          removed=sorted(set(old_by_path)-set(cur_by_path))
          print(f'OLD_INVENTORY={len(old_articles)}')
          print(f'CURRENT_INVENTORY={len(cur_articles)}')
          print(f'NEW_RECORDS={len(added)}')
          print(f'REMOVED_RECORDS={len(removed)}')
          assert len(old_articles)==839, len(old_articles)
          assert len(cur_articles)==842, len(cur_articles)
          assert len(added)==3, added
          assert not removed, removed
          rows=[]
          for path in added:
              a=cur_by_path[path]
              authors=', '.join(a.get('authors') or [])
              row={'path':path,'title':a.get('title'),'authors':authors,'url':a.get('url')}
              rows.append(row)
              print(f"NEW PAPER: {path} :: {a.get('title')} :: {authors}")
          Path('/tmp/videha-new-three.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Repair self-canonical scholarly identity on all 842 published pages
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          from urllib.parse import quote
          data=json.loads(Path('research/data/articles.json').read_text(encoding='utf-8'))
          articles=data['articles']
          assert len(articles)==842
          dois=[
            '10.5281/zenodo.22754971','10.5281/zenodo.22754977',
            '10.5281/zenodo.22754996','10.5281/zenodo.22755007',
            '10.5281/zenodo.22755014','10.5281/zenodo.22755018',
            '10.5281/zenodo.22755026','10.5281/zenodo.22755033'
          ]
          changed=0
          for a in articles:
              p=Path('research')/a['path']
              if not p.exists():
                  raise SystemExit(f'missing published page: {p}')
              s=p.read_text(encoding='utf-8')
              original=s
              encoded=quote(('research/'+a['path']), safe='/')
              mirror='https://videha-ejournal.github.io/videha/'+encoded
              official='https://www.videha.co.in/'+encoded
              s=re.sub(r'<link rel="canonical" href="[^"]*">', f'<link rel="canonical" href="{mirror}">', s, count=1)
              s=re.sub(r'<meta name="DC.identifier" content="[^"]*">', f'<meta name="DC.identifier" content="{mirror}">', s, count=1)
              s=s.replace('https://www.videha.co.in/templates/scholar-article.html', mirror)
              s=s.replace('https://videha-ejournal.github.io/videha/templates/scholar-article.html', official)
              s=s.replace('"@type":"WebPage","name"', '"@type":"CollectionPage","name"')
              s=s.replace('href="../assets/img/', 'href="../../../assets/img/')
              if f'<link rel="canonical" href="{mirror}">' not in s:
                  raise SystemExit(f'canonical repair failed: {p}')
              if f'<meta name="DC.identifier" content="{mirror}">' not in s:
                  raise SystemExit(f'DC.identifier repair failed: {p}')
              if 'templates/scholar-article.html' in s:
                  raise SystemExit(f'template identity URL remains: {p}')
              missing=[d for d in dois if d not in s]
              if missing:
                  raise SystemExit(f'missing DOI block on {p}: {missing}')
              if s != original:
                  p.write_text(s,encoding='utf-8')
                  changed += 1
          print(f'Repaired publication metadata on {changed} of {len(articles)} pages; article bodies were not edited.')
          PY
      - name: Final 842-paper publication QA
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          from urllib.parse import quote
          data=json.loads(Path('research/data/articles.json').read_text(encoding='utf-8'))
          articles=data['articles']
          pages=sorted(Path('research').glob('[0-9][0-9][0-9][0-9]/*/*.htm'))
          dois=[
            '10.5281/zenodo.22754971','10.5281/zenodo.22754977',
            '10.5281/zenodo.22754996','10.5281/zenodo.22755007',
            '10.5281/zenodo.22755014','10.5281/zenodo.22755018',
            '10.5281/zenodo.22755026','10.5281/zenodo.22755033'
          ]
          assert len(articles)==842, len(articles)
          assert len(pages)==842, len(pages)
          for a in articles:
              p=Path('research')/a['path']
              s=p.read_text(encoding='utf-8')
              mirror='https://videha-ejournal.github.io/videha/'+quote(('research/'+a['path']),safe='/')
              assert f'<link rel="canonical" href="{mirror}">' in s, p
              assert all(d in s for d in dois), p
              assert 'templates/scholar-article.html' not in s, p
          new=json.loads(Path('/tmp/videha-new-three.json').read_text(encoding='utf-8'))
          assert len(new)==3
          print('FINAL QA: 842 published pages; exactly 3 inventory additions; self-canonical metadata valid; all 8 archive DOI links present on every page.')
          for row in new:
              print(f"PUBLISHED NEW: {row['title']} :: {row['authors']} :: research/{row['path']}")
          PY
      - name: Commit finalized 842-paper publication
        run: |
          git config user.name "videha-scholar-bot"
          git config user.email "videha-scholar-bot@users.noreply.github.com"
          git add research/
          git status --short
          if git diff --cached --quiet; then
            echo "No metadata repair changes required"
          else
            git commit -m "Finalize 842-paper publication metadata [skip actions]"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              sleep 2
            done
            exit 1
          fi
