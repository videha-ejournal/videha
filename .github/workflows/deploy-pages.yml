name: Deploy Videha Pages
# Deploy current root pages together with the research corpus.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/**'
      - 'data/**'
      - 'videha-archive-explorer.html'
      - 'gajendra-thakur-samagra.htm'
      - 'pothi.htm'
      - 'index.htm'
      - 'assets/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" \
            -o /tmp/videha.tar.gz
          # Issue 450 contains a few slugs longer than the runner's
          # filesystem limit. Keep the existing corpus and metadata deployable;
          # Issue 450 remains available from the canonical archive source.
          tar -xzf /tmp/videha.tar.gz --strip-components=1 \
            --exclude='*/research/2026/450/*'

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
