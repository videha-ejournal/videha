name: Deploy Videha Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/**'
      - 'data/**'
      - 'videha-archive-explorer.html'
      - 'assets/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" \
            -o /tmp/videha.tar.gz
          # Some historical Issue 450 article slugs exceed the runner's
          # filesystem filename limit. Extract everything else so Pages can
          # still publish the index, manifest, explorer, and normal pages.
          python3 - <<'PY'
          import tarfile
          with tarfile.open('/tmp/videha.tar.gz', 'r:gz') as archive:
              members = archive.getmembers()
              root = members[0].name.split('/')[0] + '/'
              for member in members:
                  rel = member.name[len(root):] if member.name.startswith(root) else ''
                  if not rel or any(len(part) > 240 for part in rel.split('/')):
                      continue
                  member.name = rel
                  archive.extract(member, '.', filter='data')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
