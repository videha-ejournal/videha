<section class="videha-universal-search" aria-label="विदेह सार्वत्रिक खोज / Videha universal search"
  style="background:#fffdf8;border:1px solid #e5dcc8;border-top:4px solid #c49a3c;
         padding:16px 18px;margin:30px auto 14px;max-width:760px;text-align:center;
         font-family:'Noto Serif Devanagari','Kokila','Mangal',Georgia,serif;line-height:1.9;">
  <h2 style="color:#8B1A1A;font-size:1.15rem;margin:.1em 0 .5em;border:none;">

  <form action="videha-universal-search.htm" method="get"
        style="display:flex;gap:8px;max-width:600px;margin:0 auto;flex-wrap:wrap;justify-content:center;">
    <input type="search" name="q" required
      placeholder="लेखक · शीर्षक · अंक · गद्य · पद्य · पञ्जी · शब्दकोश…"
      aria-label="खोज शब्द / Search terms"
      style="flex:1 1 260px;font:inherit;font-size:1rem;padding:.45em .8em;
             border:2px solid #8B1A1A;background:#fff;color:#2a2320;">
    <button type="submit"
      style="font:inherit;font-size:.95rem;padding:.45em 1.2em;cursor:pointer;
             background:#8B1A1A;color:#fff;border:2px solid #8B1A1A;">ताकू</button>
  </form>
  <p style="font-size:.8rem;color:#5c534d;margin:.5em 0 0;">
    देवनागरी · IAST · रोमन — तीनू लिपिमे खोज ·

</section>
